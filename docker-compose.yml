version: '3.8'

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - ./volumes/open-webui:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000
      # Database access
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/llmbox
      - VECTOR_DB=pgvector
      # Redis access (if enabled in OpenWebUI)
      # - REDIS_URL=redis://redis:6379/0
    depends_on:
      - litellm
      - db
      - redis
    restart: always

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "4000:4000"
    command: --config /app/config.yaml --port 4000 --detailed_debug
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml
      - ./volumes/litellm:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: pgvector/pgvector:pg15
    container_name: db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=llmbox
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    restart: always

  context-driver:
    build: ./context_driver
    container_name: context-driver
    volumes:
      - ${BRAIN_DIR:-./volumes/brain}:/app/brain
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/llmbox
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - BRAIN_DIR=/app/brain
    depends_on:
      - db
      - litellm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  ollama:
    image: ollama/ollama:latest

    container_name: ollama
    profiles: ["ollama"]
    ports:
      - "11435:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
    restart: always
