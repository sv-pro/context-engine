

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - ./volumes/open-webui:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_BASE_URLS=http://litellm:4000/v1
      - OPENAI_API_KEYS=${LITELLM_MASTER_KEY}
      # Database access
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/webui
      - VECTOR_DB=pgvector
      # Redis access (if enabled in OpenWebUI)
      # - REDIS_URL=redis://redis:6379/0
    depends_on:
      - litellm
      - db
      - redis
    restart: always

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "4000:4000"
    command: --config /app/config.yaml --port 4000 --detailed_debug
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml
      - ./volumes/litellm:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://ollama:11434}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/litellm
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: pgvector/pgvector:pg15
    container_name: db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=llmbox
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
      - ./config/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    restart: always

  context-driver:
    build: ./context_driver
    container_name: context-driver
    volumes:
      - ${BRAIN_DIR:-./volumes/brain}:/app/brain
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/litellm
      - OLLAMA_API_BASE=http://ollama:11434
      - LITELLM_API_BASE=http://litellm:4000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - BRAIN_DIR=/app/brain
      - EMBEDDING_CONFIGURATION=${CONTEXT_DRIVER_EMBEDDING_CONFIGURATION:-ollama-nomic}
      - SEARCH_STRATEGY=${CONTEXT_DRIVER_SEARCH_STRATEGY:-super_hybrid}
      - LOG_PROMPTS=${CONTEXT_DRIVER_LOG_PROMPTS:-false}
    depends_on:
      - db
      - litellm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  ollama:
    image: ollama/ollama:latest

    container_name: ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
    restart: always
