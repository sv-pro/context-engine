<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Cost Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.2);
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .charts-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 900px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
        }
        .chart-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }
        .chart-title {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #fff;
        }
        .breakdown-list {
            list-style: none;
        }
        .breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .breakdown-item:last-child {
            border-bottom: none;
        }
        .breakdown-name {
            color: #e0e0e0;
        }
        .breakdown-value {
            color: #00d4ff;
            font-weight: 600;
        }
        .requests-table {
            width: 100%;
            border-collapse: collapse;
        }
        .requests-table th,
        .requests-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .requests-table th {
            color: #888;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .requests-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-chat { background: rgba(0, 212, 255, 0.2); color: #00d4ff; }
        .badge-embedding { background: rgba(255, 170, 0, 0.2); color: #ffaa00; }
        .badge-meta { background: rgba(170, 0, 255, 0.2); color: #aa00ff; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
            transition: transform 0.2s;
        }
        .refresh-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 LLM Cost Dashboard</h1>
        
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-cost">$0.00</div>
                <div class="stat-label">Total Cost (7 days)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-requests">0</div>
                <div class="stat-label">Total Requests</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-input">0</div>
                <div class="stat-label">Input Tokens</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-output">0</div>
                <div class="stat-label">Output Tokens</div>
            </div>
        </div>
        
        <div class="charts-row">
            <div class="chart-card">
                <h3 class="chart-title">📊 Daily Cost</h3>
                <canvas id="daily-chart" height="200"></canvas>
            </div>
            <div class="chart-card">
                <h3 class="chart-title">🤖 By Model</h3>
                <ul class="breakdown-list" id="model-breakdown">
                    <li class="loading">Loading...</li>
                </ul>
            </div>
        </div>
        
        <div class="chart-card">
            <h3 class="chart-title">📝 Recent Requests</h3>
            <table class="requests-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Operation</th>
                        <th>Model</th>
                        <th>Tokens</th>
                        <th>Cost</th>
                        <th>Latency</th>
                    </tr>
                </thead>
                <tbody id="requests-table">
                    <tr><td colspan="6" class="loading">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
    
    <script>
        let dailyChart = null;
        
        async function loadData() {
            try {
                // Load summary
                const summaryRes = await fetch('/api/costs/summary');
                const summary = await summaryRes.json();
                
                document.getElementById('total-cost').textContent = `$${summary.total_cost_usd.toFixed(4)}`;
                document.getElementById('total-requests').textContent = summary.total_requests.toLocaleString();
                document.getElementById('total-input').textContent = formatTokens(summary.total_input_tokens);
                document.getElementById('total-output').textContent = formatTokens(summary.total_output_tokens);
                
                // Model breakdown
                const modelList = document.getElementById('model-breakdown');
                modelList.innerHTML = '';
                for (const [model, cost] of Object.entries(summary.by_model)) {
                    const li = document.createElement('li');
                    li.className = 'breakdown-item';
                    li.innerHTML = `
                        <span class="breakdown-name">${model}</span>
                        <span class="breakdown-value">$${cost.toFixed(6)}</span>
                    `;
                    modelList.appendChild(li);
                }
                if (Object.keys(summary.by_model).length === 0) {
                    modelList.innerHTML = '<li class="breakdown-item"><span class="breakdown-name">No data yet</span></li>';
                }
                
                // Load daily data
                const dailyRes = await fetch('/api/costs/daily');
                const daily = await dailyRes.json();
                updateDailyChart(daily);
                
                // Load recent requests
                const requestsRes = await fetch('/api/costs/requests');
                const requests = await requestsRes.json();
                updateRequestsTable(requests);
                
            } catch (error) {
                console.error('Failed to load data:', error);
            }
        }
        
        function formatTokens(tokens) {
            if (tokens >= 1000000) return (tokens / 1000000).toFixed(1) + 'M';
            if (tokens >= 1000) return (tokens / 1000).toFixed(1) + 'K';
            return tokens.toString();
        }
        
        function updateDailyChart(data) {
            const ctx = document.getElementById('daily-chart').getContext('2d');
            
            const labels = data.map(d => d.date).reverse();
            const costs = data.map(d => d.cost).reverse();
            
            if (dailyChart) {
                dailyChart.destroy();
            }
            
            dailyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Cost ($)',
                        data: costs,
                        backgroundColor: 'rgba(0, 212, 255, 0.5)',
                        borderColor: 'rgba(0, 212, 255, 1)',
                        borderWidth: 1,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#888' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#888' }
                        }
                    }
                }
            });
        }
        
        function updateRequestsTable(requests) {
            const tbody = document.getElementById('requests-table');
            tbody.innerHTML = '';
            
            if (requests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">No requests yet</td></tr>';
                return;
            }
            
            for (const req of requests.slice(0, 20)) {
                const tr = document.createElement('tr');
                const time = new Date(req.timestamp).toLocaleTimeString();
                const badgeClass = req.operation === 'chat' ? 'badge-chat' : 
                                   req.operation === 'embedding' ? 'badge-embedding' : 'badge-meta';
                
                tr.innerHTML = `
                    <td>${time}</td>
                    <td><span class="badge ${badgeClass}">${req.operation}</span></td>
                    <td>${req.model}</td>
                    <td>${req.input_tokens}${req.output_tokens ? '+' + req.output_tokens : ''}</td>
                    <td>$${req.cost.toFixed(6)}</td>
                    <td>${req.latency_ms}ms</td>
                `;
                tbody.appendChild(tr);
            }
        }
        
        // Initial load
        loadData();
        
        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
